<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis recursos — OxygeNMedia</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5b8def">
<script src="/tema-inline.js"></script>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --success: #4caf7d; --danger: #e35d5d;
    --radius: 14px;
    --card-shadow: none;
    --input-bg: #10182a;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-heading: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: var(--font-weight-heading); }
  button {
    font-family: var(--font-body);
    background: var(--accent); color: white; border: none; padding: 9px 14px;
    border-radius: var(--radius); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  button.danger { background: var(--danger); }
  .container { max-width: 700px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }

  .recurso-item {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 8px; border-bottom: 1px solid var(--border);
  }
  .recurso-item:last-child { border-bottom: none; }
  .recurso-thumb {
    width: 52px; height: 52px; border-radius: var(--radius); object-fit: cover; flex-shrink: 0;
    background: var(--input-bg);
  }
  .recurso-info { flex: 1; min-width: 0; }
  .recurso-info .titulo { font-size: 14px; font-weight: 600; }
  .recurso-info .meta { font-size: 12px; color: var(--text-dim); }
  .recurso-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .recurso-actions button { padding: 7px 10px; font-size: 12px; }

  .empty { text-align: center; color: var(--text-dim); padding: 40px 20px; }
  .hidden { display: none !important; }

  /* Modal de edición */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px;
  }
  .modal-box {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto;
  }
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; margin-top: 12px; }
  input, textarea {
    width: 100%; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 80px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .msg { font-size: 13px; padding: 8px 12px; border-radius: var(--radius); margin-top: 10px; display: none; }
  .msg.ok { background: rgba(76,175,125,0.12); color: var(--success); display: block; }
  .msg.error { background: rgba(227,93,93,0.12); color: var(--danger); display: block; }
</style>
</head>
<body>

<header>
  <h1>📄 Mis recursos</h1>
  <a href="/"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h3 style="margin:0;">Recursos que publicaste</h3>
      <a href="/publicar-recurso"><button>+ Nuevo</button></a>
    </div>
    <div id="listaRecursos">Cargando...</div>
    <div class="empty hidden" id="emptyRecursos">
      Aún no has publicado ningún recurso.<br>
      <a href="/publicar-recurso" style="color:var(--accent);">Publica el primero</a>
    </div>
  </div>
</div>

<!-- Modal de edición -->
<div class="modal-overlay hidden" id="modalEditar">
  <div class="modal-box">
    <h3 style="margin-top:0;">Editar recurso</h3>
    <input type="hidden" id="editId">

    <label>Título</label>
    <input type="text" id="editTitulo">

    <label>Descripción corta</label>
    <textarea id="editDescripcion" style="min-height:60px;"></textarea>

    <label>Contenido completo</label>
    <textarea id="editContenido"></textarea>

    <label>Categoría</label>
    <input type="text" id="editCategoria">

    <label>URL de imagen (opcional)</label>
    <input type="text" id="editImagenURL">
    <button type="button" class="btn-ayuda-imagen secondary" data-target="editImagenURL" style="margin-top:6px; font-size:12px; padding:7px 10px;">¿No sabes cómo subir una imagen? Toca aquí</button>

    <div class="modal-actions">
      <button id="btnGuardarEdicion">Guardar cambios</button>
      <button class="secondary" id="btnCancelarEdicion">Cancelar</button>
    </div>
    <div class="msg" id="msgEditar"></div>
  </div>
</div>

<script type="module" src="/mis-recursos.js"></script>
</body>
</html>
