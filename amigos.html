<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis amigos — OxygeNMedia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b8def">
<script src="tema-inline.js"></script>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --radius: 14px;
    --card-shadow: none;
    --input-bg: #10182a;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-heading: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: var(--font-weight-heading); }
  button {
    font-family: var(--font-body);
    background: var(--accent); color: white; border: none; padding: 9px 14px;
    border-radius: var(--radius); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .container { max-width: 640px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }

  .friend-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 8px; border-bottom: 1px solid var(--border);
  }
  .friend-item:last-child { border-bottom: none; }
  .friend-avatar {
    width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; flex-shrink: 0;
  }
  .friend-info { flex: 1; min-width: 0; }
  .friend-info .nombre { font-size: 14px; font-weight: 600; }
  .friend-info .username { font-size: 12px; color: var(--text-dim); }
  .friend-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .friend-actions button { padding: 7px 10px; font-size: 12px; }

  .empty { text-align: center; color: var(--text-dim); padding: 40px 20px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>👥 Mis amigos</h1>
  <a href="index.html"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">
  <div class="card">
    <div id="listaAmigos">Cargando...</div>
    <div class="empty hidden" id="emptyAmigos">
      Aún no tienes amigos agregados.<br>
      <a href="ver-perfil.html" style="color:var(--accent);">Busca perfiles</a> para enviar solicitudes.
    </div>
  </div>
</div>

<script type="module" src="amigos.js"></script>
</body>
</html>
