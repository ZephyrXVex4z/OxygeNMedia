<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi billetera — OxygeNMedia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b8def">
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --success: #4caf7d; --danger: #e35d5d; --warn: #e0a941;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  button {
    background: var(--accent); color: white; border: none; padding: 10px 16px;
    border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .container { max-width: 560px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 16px; }

  .saldo-box { text-align: center; padding: 10px 0 20px; }
  .saldo-box .label { font-size: 13px; color: var(--text-dim); }
  .saldo-box .monto { font-size: 42px; font-weight: 800; color: var(--success); margin: 4px 0; }

  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; margin-top: 14px; }
  input {
    width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--border);
    background: #10182a; color: var(--text); font-size: 14px;
  }
  .search-result {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; margin-top: 6px; background: #10182a; cursor: pointer;
  }
  .search-result:hover { background: #17223a; }
  .search-avatar {
    width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; font-size: 13px; flex-shrink: 0;
  }
  .selected-user {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(91,141,239,0.1); border: 1px solid var(--accent);
    padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-size: 13px;
  }
  .selected-user span.quitar { cursor: pointer; color: var(--danger); font-weight: bold; }

  .msg { font-size: 13px; padding: 8px 12px; border-radius: 8px; margin-top: 12px; display: none; }
  .msg.ok { background: rgba(76,175,125,0.12); color: var(--success); display: block; }
  .msg.error { background: rgba(227,93,93,0.12); color: var(--danger); display: block; }

  .historial-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4px; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .historial-item:last-child { border-bottom: none; }
  .historial-desc { flex: 1; }
  .historial-desc .principal { color: var(--text); }
  .historial-desc .fecha { color: var(--text-dim); font-size: 11px; }
  .historial-monto.positivo { color: var(--success); font-weight: 700; }
  .historial-monto.negativo { color: var(--danger); font-weight: 700; }
  .empty { text-align: center; color: var(--text-dim); padding: 20px; font-size: 13px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>💰 Mi billetera</h1>
  <a href="index.html"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">

  <div class="card">
    <div class="saldo-box">
      <div class="label">Saldo disponible</div>
      <div class="monto" id="saldoActual">$0</div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Transferir crédito</h3>
    <label>Buscar persona (nombre o @usuario)</label>
    <input type="text" id="buscarDestinatario" placeholder="Nombre o @usuario...">
    <div id="resultadosBusqueda"></div>
    <div id="destinatarioSeleccionado"></div>

    <label>Monto</label>
    <input type="number" id="inputMonto" placeholder="0" min="1">

    <label>Motivo (opcional)</label>
    <input type="text" id="inputMotivo" placeholder="Ej. Pago pendiente">

    <button id="btnTransferir" style="width:100%; margin-top:16px;">Transferir</button>
    <div class="msg" id="msgTransferir"></div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Historial</h3>
    <div id="listaHistorial">Cargando...</div>
    <div class="empty hidden" id="emptyHistorial">Aún no tienes movimientos.</div>
  </div>

</div>

<script type="module" src="billetera.js"></script>
</body>
</html>
