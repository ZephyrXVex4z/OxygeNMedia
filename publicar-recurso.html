<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicar recurso — OxygeNMedia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b8def">
<script src="tema-inline.js"></script>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --success: #4caf7d; --danger: #e35d5d;
    --radius: 14px;
    --card-shadow: none;
    --input-bg: #10182a;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-heading: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: var(--font-weight-heading); }
  button {
    font-family: var(--font-body);
    background: var(--accent); color: white; border: none; padding: 10px 16px;
    border-radius: var(--radius); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .container { max-width: 560px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; margin-top: 14px; }
  input, textarea {
    width: 100%; padding: 11px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 100px; resize: vertical; }
  .aviso {
    background: rgba(76,175,125,0.1); border: 1px solid rgba(76,175,125,0.3);
    border-radius: var(--radius); padding: 12px 14px; font-size: 12px; color: var(--success); margin-bottom: 14px;
  }
  .msg { font-size: 13px; padding: 8px 12px; border-radius: var(--radius); margin-top: 12px; display: none; }
  .msg.ok { background: rgba(76,175,125,0.12); color: var(--success); display: block; }
  .msg.error { background: rgba(227,93,93,0.12); color: var(--danger); display: block; }
</style>
</head>
<body>

<header>
  <h1>➕ Publicar recurso</h1>
  <a href="index.html"><button class="secondary">Cancelar</button></a>
</header>

<div class="container">
  <div class="card">
    <div class="aviso">
      💚 Los recursos que publiques como usuario son siempre <strong>gratuitos</strong> para toda la comunidad.
    </div>

    <label>Título</label>
    <input type="text" id="rTitulo" placeholder="Ej. Resumen de la Revolución Mexicana">

    <label>Descripción corta</label>
    <textarea id="rDescripcion" placeholder="Breve resumen visible para todos" style="min-height:60px;"></textarea>

    <label>Contenido completo</label>
    <textarea id="rContenido" placeholder="El contenido real: información, apuntes, enlaces, etc."></textarea>

    <label>Categoría</label>
    <input type="text" id="rCategoria" placeholder="Ej. Historia, Matemáticas">

    <label>URL de imagen (opcional)</label>
    <input type="text" id="rImagenURL" placeholder="https://i.imgur.com/ejemplo.jpg">
    <button type="button" class="btn-ayuda-imagen secondary" data-target="rImagenURL" style="margin-top:6px; font-size:12px; padding:7px 10px;">¿No sabes cómo subir una imagen? Toca aquí</button>

    <button id="btnPublicar" style="width:100%; margin-top:18px;">Publicar recurso gratis</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script type="module" src="publicar-recurso.js"></script>
</body>
</html>
