<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfiles — OxygeNMedia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b8def">
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --success: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  button {
    background: var(--accent); color: white; border: none; padding: 10px 16px;
    border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  button.secondary:hover { background: var(--card); }
  .container { max-width: 560px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; margin-bottom: 16px; }

  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: #10182a; color: var(--text); font-size: 14px;
  }
  .search-result {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px; margin-top: 8px; background: #10182a;
    cursor: pointer;
  }
  .search-result:hover { background: #17223a; }
  .search-avatar {
    width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white; flex-shrink: 0;
  }
  .search-info .nombre { font-size: 14px; font-weight: 600; }
  .search-info .username { font-size: 12px; color: var(--text-dim); }

  .profile-header { text-align: center; margin-bottom: 16px; }
  .avatar-big {
    width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 700; color: white; margin: 0 auto 14px;
    border: 3px solid var(--border);
  }
  .profile-header h2 { margin: 0 0 2px 0; }
  .profile-header .username { color: var(--accent); font-size: 14px; }

  .roles-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0; }
  .role-chip {
    background: rgba(91,141,239,0.15); color: var(--accent);
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
  }
  .descripcion-box {
    background: #10182a; border-radius: 10px; padding: 14px; font-size: 14px;
    color: var(--text); white-space: pre-wrap; margin-top: 10px;
  }
  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--text-dim); padding: 20px; font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>🔎 Perfiles</h1>
  <a href="index.html"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">
  <div class="card" id="buscadorCard">
    <h3 style="margin-top:0;">Buscar por nombre o @usuario</h3>
    <input type="text" id="buscarUsername" placeholder="Nombre o @usuario...">
    <div id="resultadosBusqueda"></div>
  </div>

  <div class="card hidden" id="perfilCard">
    <button class="secondary" id="btnVolverBusqueda" style="margin-bottom:14px;">← Volver a buscar</button>
    <div class="profile-header">
      <img id="verAvatarImg" class="avatar-big hidden">
      <div id="verAvatarInicial" class="avatar-big"></div>
      <h2 id="verNombre"></h2>
      <div class="username" id="verUsername"></div>
    </div>
    <div class="roles-list" id="verRoles"></div>
    <div class="descripcion-box hidden" id="verDescripcion"></div>
    <button id="btnAmistad" class="secondary" style="width:100%; margin-top:18px;"></button>
    <button id="btnChatearDesdeAqui" style="width:100%; margin-top:10px;">💬 Enviar mensaje</button>
  </div>
</div>

<script type="module" src="ver-perfil.js"></script>
</body>
</html>
