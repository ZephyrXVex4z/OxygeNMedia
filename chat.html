<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — OxygeNMedia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b8def">
<script src="tema-inline.js"></script>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2233;
    --border: #2a3550;
    --accent: #5b8def;
    --accent-hover: #4a7ad9;
    --text: #e8ecf5;
    --text-dim: #8b96b0;
    --danger: #e35d5d;
    --success: #4caf7d;
    --bubble-me: #5b8def;
    --bubble-other: #232d45;
    --radius: 14px;
    --card-shadow: none;
    --input-bg: #10182a;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-heading: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: var(--font-weight-heading); }
  button {
    font-family: var(--font-body);
    background: var(--accent);
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  button.secondary:hover { background: var(--card); }
  button.icon-btn { padding: 8px 10px; }
  .hidden { display: none !important; }

  .layout {
    display: flex;
    height: calc(100vh - 53px);
    height: calc(100dvh - 53px);
  }

  /* Sidebar */
  .sidebar {
    width: 320px;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sidebar-actions {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-actions button { flex: 1; }
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .chat-item:hover { background: var(--card); }
  .chat-item.active { background: var(--card); border-left: 3px solid var(--accent); }
  .chat-item .nombre { font-weight: 600; font-size: 14px; }
  .chat-item .preview { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty-sidebar { padding: 30px 20px; color: var(--text-dim); text-align: center; font-size: 13px; }

  /* Ventana de chat */
  .chat-window { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header h2 { font-size: 15px; margin: 0; flex: 1; }
  .btn-volver-sidebar { display: none; }

  /* Responsive: en pantallas angostas, sidebar y chat se turnan la pantalla completa */
  @media (max-width: 720px) {
    .sidebar { width: 100%; border-right: none; }
    .layout.mostrando-chat .sidebar { display: none; }
    .layout:not(.mostrando-chat) .chat-window { display: none; }
    .btn-volver-sidebar { display: inline-flex; }
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-bubble {
    max-width: 65%;
    padding: 9px 13px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.4;
  }
  .msg-bubble.mine {
    align-self: flex-end;
    background: var(--bubble-me);
    color: white;
    border-bottom-right-radius: 3px;
  }
  .msg-bubble.theirs {
    align-self: flex-start;
    background: var(--bubble-other);
    border-bottom-left-radius: 3px;
  }
  .msg-bubble .autor { font-size: 11px; opacity: 0.75; margin-bottom: 2px; display: block; }
  .msg-bubble { position: relative; }
  .msg-editado { font-size: 10px; opacity: 0.6; margin-left: 6px; }
  .msg-menu-btn {
    cursor: pointer; opacity: 0.5; margin-left: 8px; padding: 0 4px; font-weight: bold;
    user-select: none;
  }
  .msg-menu-btn:hover { opacity: 1; }
  .msg-menu {
    position: absolute; top: 100%; right: 0; margin-top: 4px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; z-index: 20; overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4); min-width: 110px;
  }
  .msg-menu button {
    background: none; border: none; color: var(--text); padding: 9px 14px;
    font-size: 13px; text-align: left; cursor: pointer; border-radius: 0;
  }
  .msg-menu button:hover { background: var(--input-bg); }
  .msg-menu button.danger-text { color: var(--danger); }
  .msg-edit-input {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.1); color: inherit; font-size: 14px; font-family: inherit;
  }
  .msg-edit-actions { display: flex; gap: 6px; margin-top: 6px; }
  .msg-edit-actions button { padding: 4px 10px; font-size: 12px; }
  .msg-input-row {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  .msg-input-row input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 16px;
  }
  .no-chat-selected {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    flex-direction: column;
    gap: 8px;
  }

  /* Modales */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .modal-box {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; max-width: 420px; width: 90%; max-height: 80vh; overflow-y: auto;
  }
  .modal-box h3 { margin-top: 0; }
  .modal-box input { width: 100%; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 14px; margin-bottom: 10px; }
  .search-result {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-radius: var(--radius); margin-bottom: 6px; background: var(--input-bg);
    font-size: 13px;
  }
  .search-result button { padding: 5px 10px; font-size: 12px; }
  .selected-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(91,141,239,0.15); color: var(--accent);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; margin: 3px 4px 3px 0;
  }
  .selected-chip span { cursor: pointer; font-weight: bold; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
</style>
</head>
<body>

<header>
  <h1>💬 Chat</h1>
  <div>
    <a href="index.html"><button class="secondary">Volver al sitio</button></a>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-actions">
      <button id="btnNuevoChat">+ Chat privado</button>
      <button id="btnNuevoGrupo">+ Grupo</button>
    </div>
    <div class="chat-list" id="chatList">
      <div class="empty-sidebar">Cargando conversaciones...</div>
    </div>
  </div>

  <div class="chat-window">
    <div class="no-chat-selected" id="noChatSelected">
      <div style="font-size:40px;">💬</div>
      <p>Selecciona una conversación o inicia una nueva</p>
    </div>

    <div class="hidden" id="activeChatArea" style="display:flex; flex-direction:column; flex:1;">
      <div class="chat-header">
        <button class="secondary icon-btn btn-volver-sidebar" id="btnVolverSidebar">←</button>
        <h2 id="chatTitulo"></h2>
        <button class="secondary icon-btn hidden" id="btnGestionarMiembros">👥 Miembros</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="msg-input-row">
        <input type="text" id="inputMensaje" placeholder="Escribe un mensaje...">
        <button id="btnEnviar">Enviar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: nuevo chat privado -->
<div class="modal-overlay hidden" id="modalNuevoChat">
  <div class="modal-box">
    <h3>Nuevo chat privado</h3>
    <input type="text" id="buscarUsuarioPrivado" placeholder="Buscar por nombre...">
    <div id="resultadosPrivado"></div>
    <div class="modal-actions">
      <button class="secondary" data-close-modal="modalNuevoChat">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal: nuevo grupo -->
<div class="modal-overlay hidden" id="modalNuevoGrupo">
  <div class="modal-box">
    <h3>Nuevo grupo</h3>
    <input type="text" id="nombreGrupo" placeholder="Nombre del grupo">
    <input type="text" id="buscarUsuarioGrupo" placeholder="Buscar personas para agregar...">
    <div id="resultadosGrupo"></div>
    <div id="seleccionadosGrupo"></div>
    <div class="modal-actions">
      <button id="btnCrearGrupo">Crear grupo</button>
      <button class="secondary" data-close-modal="modalNuevoGrupo">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal: gestionar miembros -->
<div class="modal-overlay hidden" id="modalMiembros">
  <div class="modal-box">
    <h3>Miembros del grupo</h3>
    <div id="listaMiembrosActuales"></div>
    <input type="text" id="buscarUsuarioAgregar" placeholder="Agregar persona...">
    <div id="resultadosAgregar"></div>
    <div class="modal-actions">
      <button class="secondary" data-close-modal="modalMiembros">Cerrar</button>
    </div>
  </div>
</div>

<script type="module" src="chat.js"></script>
</body>
</html>
