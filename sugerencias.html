<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugerencias — OxygeNMedia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b8def">
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2233;
    --border: #2a3550;
    --accent: #5b8def;
    --accent-hover: #4a7ad9;
    --text: #e8ecf5;
    --text-dim: #8b96b0;
    --success: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  button.secondary:hover { background: var(--card); }
  .container { max-width: 640px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #10182a;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 10px;
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .checkbox-row input { width: auto; }
  .sugerencia-item {
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  .sugerencia-item:last-child { border-bottom: none; }
  .sugerencia-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .sugerencia-texto { font-size: 14px; white-space: pre-wrap; }
  .badge-estado {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(224,169,65,0.15);
    color: #e0a941;
  }
  .badge-estado.revisada { background: rgba(76,175,125,0.15); color: var(--success); }
  .empty { text-align: center; color: var(--text-dim); padding: 30px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>💡 Sugerencias</h1>
  <a href="index.html"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">
  <div class="card">
    <h3 style="margin-top:0;">Deja tu sugerencia o reporte</h3>
    <textarea id="textoSugerencia" placeholder="¿Qué te gustaría que agregáramos? ¿Encontraste algún error?"></textarea>
    <div class="checkbox-row">
      <input type="checkbox" id="checkAnonimo">
      <label for="checkAnonimo" style="margin:0;">Enviar de forma anónima</label>
    </div>
    <button id="btnEnviarSugerencia">Enviar sugerencia</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Sugerencias de la comunidad</h3>
    <div id="listaSugerencias">Cargando...</div>
    <div class="empty hidden" id="emptySugerencias">Aún no hay sugerencias. ¡Sé el primero!</div>
  </div>
</div>

<script type="module" src="sugerencias.js"></script>
</body>
</html>
