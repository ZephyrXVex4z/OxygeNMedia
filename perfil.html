<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil — OxygeNMedia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5b8def">
<script src="tema-inline.js"></script>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --success: #4caf7d; --danger: #e35d5d; --warn: #e0a941;
    --radius: 14px;
    --card-shadow: none;
    --input-bg: #10182a;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-heading: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: var(--font-weight-heading); }
  button {
    font-family: var(--font-body);
    background: var(--accent); color: white; border: none; padding: 10px 16px;
    border-radius: var(--radius); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  button.secondary:hover { background: var(--card); }
  button.small { padding: 5px 10px; font-size: 12px; }
  .container { max-width: 560px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; }

  .avatar-preview {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700; color: white; margin: 0 auto 16px;
    border: 3px solid var(--border);
  }
  .profile-header { text-align: center; margin-bottom: 8px; }
  .profile-header h2 { margin: 0 0 2px 0; }
  .profile-header .username { color: var(--accent); font-size: 14px; }
  .profile-header .userid { color: var(--text-dim); font-size: 11px; margin-top: 4px; font-family: monospace; }

  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; margin-top: 14px; }
  input, textarea {
    width: 100%; padding: 11px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 80px; resize: vertical; }
  .username-input-row { display: flex; align-items: center; gap: 4px; }
  .username-prefix { color: var(--text-dim); font-size: 14px; }
  .field-msg { font-size: 12px; margin-top: 4px; display: none; }
  .field-msg.error { color: var(--danger); display: block; }
  .field-msg.ok { color: var(--success); display: block; }

  .roles-actuales { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .role-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(91,141,239,0.15); color: var(--accent);
    padding: 5px 12px; border-radius: 999px; font-size: 12px;
  }
  .role-chip.pendiente { background: rgba(224,169,65,0.15); color: var(--warn); }
  .role-chip span { cursor: pointer; font-weight: bold; opacity: 0.7; }

  .roles-disponibles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .role-option {
    padding: 5px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-dim);
  }
  .role-option:hover { background: var(--input-bg); }

  .proponer-rol-row { display: flex; gap: 8px; margin-top: 12px; }
  .proponer-rol-row input { flex: 1; }
  .proponer-rol-row button { white-space: nowrap; }

  .msg-guardado { font-size: 13px; padding: 8px 12px; border-radius: var(--radius); margin-top: 12px; display: none; }
  .msg-guardado.ok { background: rgba(76,175,125,0.12); color: var(--success); display: block; }
  .msg-guardado.error { background: rgba(227,93,93,0.12); color: var(--danger); display: block; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>👤 Mi perfil</h1>
  <a href="index.html"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">
  <div class="card">
    <div class="profile-header">
      <img id="avatarPreview" class="avatar-preview hidden">
      <div id="avatarInicial" class="avatar-preview"></div>
      <h2 id="nombreActual">Cargando...</h2>
      <div class="username" id="usernameActual"></div>
      <div class="userid" id="useridActual"></div>
    </div>

    <label>Nombre que se ve en el sitio</label>
    <input type="text" id="inputNombre" placeholder="Tu nombre">

    <label>Nombre de usuario (@único)</label>
    <div class="username-input-row">
      <span class="username-prefix">@</span>
      <input type="text" id="inputUsername" placeholder="tu-usuario">
    </div>
    <div class="field-msg" id="usernameMsg"></div>

    <label>URL de foto de perfil (opcional — link de Imgur u otro servicio)</label>
    <input type="text" id="inputFotoURL" placeholder="https://i.imgur.com/ejemplo.jpg">

    <label>Descripción / bio</label>
    <textarea id="inputDescripcion" placeholder="Cuéntale algo a los demás sobre ti..."></textarea>

    <label>Roles</label>
    <div class="roles-actuales" id="rolesActuales"></div>

    <label style="margin-top:18px;">Agregar un rol existente</label>
    <div class="roles-disponibles" id="rolesDisponiblesLista"></div>

    <label style="margin-top:18px;">¿No está tu rol? Propón uno nuevo</label>
    <div class="proponer-rol-row">
      <input type="text" id="inputNuevoRol" placeholder="Ej. Helper, Diseñador...">
      <button class="secondary" id="btnProponerRol">Proponer</button>
    </div>
    <div class="field-msg" id="proponerRolMsg"></div>

    <button id="btnGuardarPerfil" style="width:100%; margin-top:20px;">Guardar cambios</button>
    <div class="msg-guardado" id="msgGuardado"></div>
  </div>
</div>

<script type="module" src="perfil.js"></script>
</body>
</html>
