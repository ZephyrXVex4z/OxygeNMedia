<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novedades — OxygeNMedia</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5b8def">
<script src="/tema-inline.js"></script>
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --success: #4caf7d; --danger: #e35d5d; --warn: #e0a941;
    --radius: 14px; --card-shadow: none; --input-bg: #10182a;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-heading: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: var(--font-weight-heading); }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  button {
    font-family: var(--font-body);
    background: var(--accent); color: white; border: none; padding: 9px 15px;
    border-radius: var(--radius); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .container { max-width: 620px; margin: 24px auto; padding: 0 20px; }

  .update-item {
    position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--card-shadow); padding: 18px 20px; margin-bottom: 16px;
  }
  .update-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .update-tag {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .update-tag.nueva_funcion { background: rgba(76,175,125,0.15); color: var(--success); }
  .update-tag.mejora { background: rgba(91,141,239,0.15); color: var(--accent); }
  .update-tag.arreglo { background: rgba(224,169,65,0.15); color: var(--warn); }
  .update-version { font-size: 12px; color: var(--text-dim); font-family: monospace; }
  .update-fecha { font-size: 11px; color: var(--text-dim); margin-left: auto; }
  .update-titulo { font-size: 16px; font-weight: 600; margin: 4px 0 6px; }
  .update-desc { font-size: 14px; color: var(--text-dim); line-height: 1.5; white-space: pre-wrap; }

  .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }
</style>
</head>
<body>

<header>
  <h1>📣 Novedades</h1>
  <a href="/"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">
  <div id="listaActualizaciones">Cargando...</div>
  <div class="empty hidden" id="emptyActualizaciones">Todavía no hay actualizaciones publicadas.</div>
</div>

<script type="module" src="/novedades.js"></script>
</body>
</html>
