<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos — OxygeNMedia</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5b8def">
<script src="/tema-inline.js"></script>
<style>
  :root {
    --bg: #0f1420; --card: #1a2233; --border: #2a3550; --accent: #5b8def;
    --accent-hover: #4a7ad9; --text: #e8ecf5; --text-dim: #8b96b0;
    --success: #4caf7d; --danger: #e35d5d; --warn: #e0a941;
    --radius: 14px;
    --card-shadow: none;
    --input-bg: #10182a;
    --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-weight-heading: 700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: var(--font-weight-heading); }
  button {
    font-family: var(--font-body);
    background: var(--accent); color: white; border: none; padding: 10px 16px;
    border-radius: var(--radius); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  button.secondary:hover { background: var(--card); }
  .container { max-width: 900px; margin: 24px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .game-card {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; cursor: pointer; transition: border-color 0.15s;
  }
  .game-card:hover { border-color: var(--accent); }
  .game-card h3 { margin: 0 0 6px 0; font-size: 15px; }
  .game-card p { margin: 0; font-size: 12px; color: var(--text-dim); }
  .game-meta { font-size: 11px; color: var(--text-dim); margin-top: 8px; }

  input[type="text"], textarea {
    width: 100%; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text); font-size: 14px; margin-bottom: 10px; font-family: inherit;
  }
  label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .file-input-row {
    border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px;
    text-align: center; margin-bottom: 12px; cursor: pointer;
  }
  .file-input-row:hover { border-color: var(--accent); }
  .file-name { font-size: 13px; color: var(--success); margin-top: 8px; }

  .msg { font-size: 13px; padding: 8px 12px; border-radius: var(--radius); margin-top: 10px; display: none; }
  .msg.ok { background: rgba(76,175,125,0.12); color: var(--success); display: block; }
  .msg.error { background: rgba(227,93,93,0.12); color: var(--danger); display: block; }
  .msg.warn { background: rgba(224,169,65,0.12); color: var(--warn); display: block; }

  .aviso-seguridad {
    background: rgba(224,169,65,0.1); border: 1px solid rgba(224,169,65,0.3);
    border-radius: var(--radius); padding: 12px 14px; font-size: 12px; color: var(--warn); margin-bottom: 14px;
  }

  /* Vista de jugar */
  .jugar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .jugar-header h2 { margin: 0; font-size: 16px; }
  iframe#gameFrame {
    width: 100%; height: 70vh; border: 1px solid var(--border); border-radius: var(--radius);
    background: white;
  }
  .hidden { display: none !important; }
  .empty { text-align: center; color: var(--text-dim); padding: 40px; }
  .badge-pendiente { font-size: 10px; background: rgba(224,169,65,0.15); color: var(--warn); padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
</style>
</head>
<body>

<header>
  <h1>🎮 Juegos</h1>
  <a href="/"><button class="secondary">Volver al sitio</button></a>
</header>

<div class="container">

  <!-- Vista: lista de juegos -->
  <div id="listaView">
    <div class="card">
      <h3 style="margin-top:0;">Subir un juego</h3>
      <div class="aviso-seguridad">
        ⚠️ Solo se aceptan archivos <strong>.html</strong> autocontenidos (HTML/CSS/JS en un solo archivo), máximo 900 KB. Los juegos corren en un espacio aislado sin acceso a datos de otros usuarios.
      </div>
      <label>Nombre del juego</label>
      <input type="text" id="inputNombreJuego" placeholder="Ej. Buscaminas">
      <label>Descripción corta</label>
      <textarea id="inputDescripcionJuego" placeholder="De qué trata el juego" style="min-height:60px;"></textarea>
      <label>Archivo .html</label>
      <div class="file-input-row" id="fileDropZone">
        <span id="fileDropText">Click para elegir tu archivo .html</span>
        <div class="file-name hidden" id="fileNameDisplay"></div>
      </div>
      <input type="file" id="inputArchivo" accept=".html" class="hidden">
      <button id="btnSubirJuego" style="width:100%;">Subir juego</button>
      <div class="msg" id="msgSubida"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Juegos disponibles</h3>
      <div class="grid" id="gridJuegos"></div>
      <div class="empty hidden" id="emptyJuegos">Aún no hay juegos publicados.</div>
    </div>
  </div>

  <!-- Vista: jugando -->
  <div id="jugarView" class="hidden">
    <div class="jugar-header">
      <h2 id="jugarTitulo"></h2>
      <button class="secondary" id="btnVolverLista">← Volver a la lista</button>
    </div>
    <iframe id="gameFrame" sandbox="allow-scripts"></iframe>
  </div>

</div>

<script type="module" src="/juegos.js"></script>
</body>
</html>
